# 自动发布到 crates.io
# 当创建新的版本 tag (v*) 时自动发布

name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run clippy
        run: cargo clippy -- -D warnings
      
      - name: Run tests
        run: cargo test --verbose
      
      - name: Build CLI
        run: cargo build --features cli --bin wr
      
      - name: Verify package
        run: cargo publish --dry-run

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: verify
    environment: crates.io
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Build CLI binary
        run: cargo build --release --features cli --bin wr
      
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: target/release/wr

  notify:
    name: Notify on success
    runs-on: ubuntu-latest
    needs: publish
    if: success()
    steps:
      - name: Success notification
        run: |
          echo "✅ Successfully published to crates.io"
          echo "Package: world_rules ${{ github.ref_name }}"
          echo "https://crates.io/crates/world_rules"