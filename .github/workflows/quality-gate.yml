name: Quality Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-check:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install tools
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo install cargo-outdated --locked 2>/dev/null || true

      - name: Check formatting
        run: |
          echo "## 🎨 代码格式检查" >> $GITHUB_STEP_SUMMARY
          if cargo fmt --all -- --check; then
            echo "✅ 格式检查通过" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 格式检查失败" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Clippy check
        run: |
          echo "## 🔍 Clippy 检查" >> $GITHUB_STEP_SUMMARY
          if cargo clippy -- -D warnings; then
            echo "✅ Clippy 检查通过（零警告）" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Clippy 检查失败（存在警告）" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Security audit
        run: |
          echo "## 🔒 安全审计" >> $GITHUB_STEP_SUMMARY
          if cargo audit 2>&1 | tee audit-output.txt; then
            echo "✅ 安全审计通过（无已知漏洞）" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ 发现安全漏洞" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat audit-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run tests
        run: |
          echo "## 🧪 测试检查" >> $GITHUB_STEP_SUMMARY
          if cargo test --lib --verbose 2>&1 | tee test-output.txt; then
            TEST_COUNT=$(grep -c "test result:" test-output.txt || echo "0")
            echo "✅ 所有测试通过 ($TEST_COUNT tests)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 测试失败" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Build documentation
        run: |
          echo "## 📚 文档检查" >> $GITHUB_STEP_SUMMARY
          if cargo doc --no-deps; then
            echo "✅ 文档编译通过" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ 文档编译失败" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Quality Gate Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ 质量门禁报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 格式检查 | ${{ steps.format.outcome }} |" >> $GITHUB_STEP_SUMMARY || echo "| 格式检查 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Clippy | ${{ steps.clippy.outcome }} |" >> $GITHUB_STEP_SUMMARY || echo "| Clippy | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 安全审计 | ${{ steps.audit.outcome }} |" >> $GITHUB_STEP_SUMMARY || echo "| 安全审计 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 测试 | ${{ steps.test.outcome }} |" >> $GITHUB_STEP_SUMMARY || echo "| 测试 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| 文档 | ${{ steps.doc.outcome }} |" >> $GITHUB_STEP_SUMMARY || echo "| 文档 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**检查时间**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  complexity-check:
    name: Code Complexity
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Install complexity tools
        run: |
          cargo install cargo-clippy --locked 2>/dev/null || true
          
      - name: Check code complexity
        run: |
          echo "## 📊 代码复杂度检查" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 统计代码行数
          TOTAL_LINES=$(find src -name "*.rs" -exec wc -l {} + | tail -1 | awk '{print $1}')
          echo "**总代码行数**: $TOTAL_LINES" >> $GITHUB_STEP_SUMMARY
          
          # 统计文件数
          FILE_COUNT=$(find src -name "*.rs" | wc -l)
          echo "**源文件数**: $FILE_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # 统计测试数量
          TEST_COUNT=$(grep -r "#\[test\]" src | wc -l)
          echo "**测试数量**: $TEST_COUNT" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ 复杂度检查完成" >> $GITHUB_STEP_SUMMARY

  quality-badge:
    name: Update Quality Badge
    runs-on: ubuntu-latest
    needs: [quality-check]
    if: success()
    steps:
      - name: Quality badge status
        run: |
          echo "## 🎖️ 质量徽章" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "所有质量门禁检查通过！项目质量状态：" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 编译通过" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 测试通过" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 格式正确" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Clippy 零警告" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 安全审计通过" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ 文档编译通过" >> $GITHUB_STEP_SUMMARY