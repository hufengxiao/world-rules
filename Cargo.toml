[package]
name = "world_rules"
version = "2.0.0"
edition = "2021"
description = "世界规则库 - 收集各种游戏、体育、社交、科学、法律规则"
license = "MIT"
repository = "https://github.com/hufengxiao/world-rules"
authors = ["hufengxiao"]
keywords = ["rules", "games", "sports", "law", "science"]
categories = ["game-development", "command-line-utilities"]
exclude = ["AUDIT_REPORT.md", ".github/"]

[dependencies]
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
cli = []
full = []
serde_json = []

[dev-dependencies]
serde_json = "1"
criterion = "0.8"
proptest = "1.4"

[[bench]]
name = "mahjong_bench"
harness = false

[[bench]]
name = "poker_bench"
harness = false

[[bench]]
name = "sudoku_bench"
harness = false

[[bench]]
name = "law_bench"
harness = false

[[bin]]
name = "wr"
path = "src/bin/wr.rs"
required-features = ["cli"]

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "advanced_usage"
path = "examples/advanced_usage.rs"

[[example]]
name = "complete_app"
path = "examples/complete_app.rs"

[[example]]
name = "validate_games"
path = "examples/validate_games.rs"

[[example]]
name = "migration_basic"
path = "examples/migration_basic.rs"

[[example]]
name = "migration_new_features"
path = "examples/migration_new_features.rs"

[[example]]
name = "migration_batch_processing"
path = "examples/migration_batch_processing.rs"
