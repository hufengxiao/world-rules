[package]
name = "world_rules"
version = "0.6.0"
edition = "2021"
description = "世界规则库 - 收集各种游戏、体育、社交、科学、法律规则"
license = "MIT"
repository = "https://github.com/hufengxiao/world-rules"
keywords = ["rules", "mahjong", "poker", "games", "etiquette", "sports", "law", "science"]
categories = ["game-development", "command-line-utilities"]

[dependencies]
thiserror = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[features]
default = []
cli = ["serde_json"]
full = ["serde_json"]

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "wr"
path = "src/bin/wr.rs"
required-features = ["cli"]

[[example]]
name = "demo"
path = "examples/demo.rs"
